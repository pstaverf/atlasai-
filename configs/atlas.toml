# Atlas AI — small CPU configuration.
# Relative paths are resolved from THIS file's directory, not the shell cwd.
# Decoding settings are reserved for the stage-4 LLM adapter.

[runtime]
device = "cpu"             # CPU only through stage 3.
seed = 42
num_threads = 1            # Conservative default for a small VPS.
data_dir = "../data"
checkpoint_dir = "../checkpoints"

[model]
backend = "atlas-local"    # Our own transformer; no Ollama or external LLM API.
tokenizer_path = "../checkpoints/tokenizer.json"
checkpoint_path = "../checkpoints/atlas.pt"
context_length = 64
max_new_tokens = 64
temperature = 0.0            # Deterministic decoding is the initial target.

[tokenizer]
vocab_size = 512             # 3 special tokens + 256 bytes + learned merges.
min_frequency = 2

[data]
input_paths = ["../examples/corpus.txt"]
stride = 64                 # Training requires non-overlapping train/validation windows.
val_fraction = 0.2

[transformer]
d_model = 384
num_layers = 6
num_heads = 8
dropout = 0.1
tie_embeddings = true

[training]
batch_size = 1
max_steps = 60
learning_rate = 0.001
weight_decay = 0.01
grad_clip = 1.0
eval_every = 20
log_every = 10
